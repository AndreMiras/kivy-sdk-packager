name: SDL2 wheels

on:
  pull_request:
    paths:
      - 'win/common.py'
      - 'win/sdl2.py'
      - 'ci/windows_ci.ps1'
      - 'ci/kivy-stable-test-constraints.txt'
      - 'ci/check_wheel_origins.py'
      - '.github/workflows/windows_sdl2_wheels.yml'
  push:
    branches:
      - ci/sdl2-py314-angle05-trial
    paths:
      - 'win/common.py'
      - 'win/sdl2.py'
      - 'ci/windows_ci.ps1'
      - 'ci/kivy-stable-test-constraints.txt'
      - 'ci/check_wheel_origins.py'
      - '.github/workflows/windows_sdl2_wheels.yml'

env:
  SERVER_IP: '159.203.106.198'
  KIVY_BUILD_DIR: kivy_build
  KIVY_BUILD_CACHE: kivy_build_cache
  PACKAGE_TARGET: sdl2
  PYTHONPATH: .

jobs:
  prepare_cache:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: ['x64']
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Cache deps
        id: cache
        uses: actions/cache@v4
        with:
          path: kivy_build_cache
          key: cache-packages-sdl2-${{ matrix.arch }}-${{ hashFiles('win/sdl2.py') }}
      - name: Prepare Environment
        run: |
          . .\ci\windows_ci.ps1
          Prepre-env
      - name: Download Dependencies
        run: |
          . .\ci\windows_ci.ps1
          Download-Packages

  windows_wheels:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: prepare_cache
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.14' ]
        arch: ['x64']
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.arch }}
    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: kivy_build_cache
        key: cache-packages-sdl2-${{ matrix.arch }}-${{ hashFiles('win/sdl2.py') }}
    - name: Prepare Environment
      run: |
        . .\ci\windows_ci.ps1
        Prepre-env
    - name: Build package
      run: |
        . .\ci\windows_ci.ps1
        Create-Packages
    - name: Upload wheels as artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        name: sdl2_wheels-${{ matrix.python }}-${{ matrix.arch }}
        path: dist
    - name: Install MSYS2
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      run: choco install msys2
    - name: Upload wheels to server
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      env:
        UBUNTU_UPLOAD_KEY: ${{ secrets.UBUNTU_UPLOAD_KEY }}
        MSYSTEM: MINGW64
        CHERE_INVOKING: 1
      run: |
        . .\ci\windows_ci.ps1
        Upload-windows-wheels-to-server -ip "$env:SERVER_IP"
    - name: Publish to PyPI
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.pypi_password }}
      run: |
        twine upload --non-interactive dist/*
    - name: Prepare published ANGLE 0.5.0 cp314 trial wheels
      run: |
        python -m pip download --index-url https://pypi.org/simple --no-deps --only-binary=:all: --platform win_amd64 --implementation cp --python-version 3.14 --abi cp314 --dest angle05_sources kivy-deps.angle==0.5.0 kivy-deps.angle-dev==0.5.0
        if ($LASTEXITCODE -ne 0) { throw 'Downloading the published ANGLE 0.5.0 pair failed' }
        @'
        import hashlib
        from email.parser import Parser
        from pathlib import Path
        import zipfile

        sources = {
            'kivy_deps_angle-0.5.0-cp314-cp314-win_amd64.whl': (
                'kivy_deps.angle',
                'baaa35e153f053e23ef3de8c6f96e3aa6a59ea74d9d9b0bd104b7cb534f03f15'),
            'kivy_deps_angle_dev-0.5.0-cp314-cp314-win_amd64.whl': (
                'kivy_deps.angle_dev',
                '6378db32e193a1427acbc4ebb7de0832fe87033c63bdc32c5d03de04a83ea173'),
        }
        constraints = []
        for filename, (name, expected) in sources.items():
            source = (Path('angle05_sources') / filename).resolve(strict=True)
            payload = source.read_bytes()
            if hashlib.sha256(payload).hexdigest() != expected:
                raise RuntimeError('Published ANGLE source hash mismatch: ' + filename)
            with zipfile.ZipFile(source) as archive:
                members = set(archive.namelist())
                wheel = next(name for name in members if name.endswith('.dist-info/WHEEL'))
                tags = Parser().parsestr(archive.read(wheel).decode('utf8')).get_all('Tag')
                if tags != ['cp314-cp314-win_amd64']:
                    raise RuntimeError('Incorrect ANGLE wheel tags')
                metadata = next(member for member in members if member.endswith('.dist-info/METADATA'))
                metadata = Parser().parsestr(archive.read(metadata).decode('utf8'))
                if metadata['Name'] != name or metadata['Version'] != '0.5.0':
                    raise RuntimeError('Incorrect ANGLE distribution metadata')
                for member in sorted(members):
                    if member.lower().endswith('.dll'):
                        print('ANGLE native payload: {} sha256={}'.format(
                            Path(member).name, hashlib.sha256(archive.read(member)).hexdigest()), flush=True)
            target = (Path('dist') / filename).resolve()
            target.write_bytes(payload)
            reference = '{}#sha256={}'.format(target.as_uri(), expected)
            constraint = '{} @ {}'.format(name, reference)
            constraints.append(constraint)
            print('ANGLE local wheel: ' + constraint, flush=True)
        Path('angle05-wheel-constraints.txt').write_text('\n'.join(constraints) + '\n', encoding='utf8')
        '@ | python -
        if ($LASTEXITCODE -ne 0) { throw 'Preparing verified ANGLE 0.5.0 cp314 wheels failed' }
        $angleWheels = @(Get-ChildItem -LiteralPath dist -Filter 'kivy_deps_angle*-0.5.0-cp314-cp314-win_amd64.whl' -File | ForEach-Object { $_.FullName })
        if ($angleWheels.Count -ne 2) { throw 'Expected the ANGLE 0.5.0 cp314 runtime/development pair' }
        python -m pip install --no-index --no-deps --force-reinstall @angleWheels
        if ($LASTEXITCODE -ne 0) { throw 'Installing the explicit ANGLE 0.5.0 trial wheels failed' }
        python ci/check_wheel_origins.py angle05-wheel-constraints.txt
        if ($LASTEXITCODE -ne 0) { throw 'ANGLE 0.5.0 pre-suite origin verification failed' }
        python -c "from kivy_deps import angle, angle_dev; assert angle.__version__ == angle_dev.__version__ == '0.5.0'; print('ANGLE trial versions:', angle.__version__, angle_dev.__version__)"
        if ($LASTEXITCODE -ne 0) { throw 'Importing ANGLE 0.5.0 trial packages failed' }
    - name: Test package
      run: |
        python -m pip install --only-binary=:all: Pillow==11.3.0
        if ($LASTEXITCODE -ne 0) { throw 'Installing the Pillow 11.3.0 trial wheel failed' }
        python -c "import PIL, PIL._imaging; print('Pillow compatibility trial:', PIL.__version__, PIL._imaging.__file__)"
        if ($LASTEXITCODE -ne 0) { throw 'Importing the Pillow 11.3.0 native extension failed' }
        . .\ci\windows_ci.ps1
        Test-kivy -KivyTestTarget stable -Angle05Trial -PillowTrial -FStringParserTrial
        python ci/check_wheel_origins.py angle05-wheel-constraints.txt
        if ($LASTEXITCODE -ne 0) { throw 'ANGLE 0.5.0 post-suite origin verification failed' }
