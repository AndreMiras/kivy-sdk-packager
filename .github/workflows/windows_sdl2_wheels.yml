name: SDL2 wheels

on:
  pull_request:
    paths:
      - 'win/common.py'
      - 'win/sdl2.py'
      - 'ci/windows_ci.ps1'
      - 'ci/kivy-stable-test-constraints.txt'
      - 'ci/check_wheel_origins.py'
      - '.github/workflows/windows_sdl2_wheels.yml'
  push:
    branches:
      - ci/sdl2-py314-angle04-trial
    paths:
      - 'win/common.py'
      - 'win/sdl2.py'
      - 'ci/windows_ci.ps1'
      - 'ci/kivy-stable-test-constraints.txt'
      - 'ci/check_wheel_origins.py'
      - '.github/workflows/windows_sdl2_wheels.yml'

env:
  SERVER_IP: '159.203.106.198'
  KIVY_BUILD_DIR: kivy_build
  KIVY_BUILD_CACHE: kivy_build_cache
  PACKAGE_TARGET: sdl2
  PYTHONPATH: .

jobs:
  prepare_cache:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: ['x64']
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Cache deps
        id: cache
        uses: actions/cache@v4
        with:
          path: kivy_build_cache
          key: cache-packages-sdl2-${{ matrix.arch }}-${{ hashFiles('win/sdl2.py') }}
      - name: Prepare Environment
        run: |
          . .\ci\windows_ci.ps1
          Prepre-env
      - name: Download Dependencies
        run: |
          . .\ci\windows_ci.ps1
          Download-Packages

  windows_wheels:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: prepare_cache
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.14' ]
        arch: ['x64']
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.arch }}
    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: kivy_build_cache
        key: cache-packages-sdl2-${{ matrix.arch }}-${{ hashFiles('win/sdl2.py') }}
    - name: Prepare Environment
      run: |
        . .\ci\windows_ci.ps1
        Prepre-env
    - name: Build package
      run: |
        . .\ci\windows_ci.ps1
        Create-Packages
    - name: Upload wheels as artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        name: sdl2_wheels-${{ matrix.python }}-${{ matrix.arch }}
        path: dist
    - name: Install MSYS2
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      run: choco install msys2
    - name: Upload wheels to server
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      env:
        UBUNTU_UPLOAD_KEY: ${{ secrets.UBUNTU_UPLOAD_KEY }}
        MSYSTEM: MINGW64
        CHERE_INVOKING: 1
      run: |
        . .\ci\windows_ci.ps1
        Upload-windows-wheels-to-server -ip "$env:SERVER_IP"
    - name: Publish to PyPI
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.pypi_password }}
      run: |
        twine upload --non-interactive dist/*
    - name: Prepare ANGLE 0.4.0 cp314 trial wheels
      run: |
        python -m pip install wheel==0.45.1
        if ($LASTEXITCODE -ne 0) { throw 'Installing the wheel retagging tool failed' }
        python -m pip download --index-url https://pypi.org/simple --no-deps --only-binary=:all: --platform win_amd64 --implementation cp --python-version 3.13 --abi cp313 --dest angle04_sources kivy-deps.angle==0.4.0 kivy-deps.angle-dev==0.4.0
        if ($LASTEXITCODE -ne 0) { throw 'Downloading the published ANGLE 0.4.0 pair failed' }
        @'
        import hashlib
        from email.parser import Parser
        from pathlib import Path
        import subprocess
        import sys
        import zipfile

        sources = {
            'kivy_deps.angle-0.4.0-cp313-cp313-win_amd64.whl':
                '9afbf702f8bb9a993c48f39c018ca3b4d2ec381a5d3f82fe65bdaa6af0bba29b',
            'kivy_deps.angle_dev-0.4.0-cp313-cp313-win_amd64.whl':
                '03fe26cddf9cf04f7579fd5d25f44a205d2e4cd9f9a5ee40a347ce5a59b87822',
        }
        constraints = []
        for filename, expected in sources.items():
            source = (Path('angle04_sources') / filename).resolve(strict=True)
            if hashlib.sha256(source.read_bytes()).hexdigest() != expected:
                raise RuntimeError('Published ANGLE source hash mismatch: ' + filename)
            subprocess.run([sys.executable, '-m', 'wheel', 'tags', '--python-tag', 'cp314',
                            '--abi-tag', 'cp314', '--platform-tag', 'win_amd64', str(source)],
                           check=True)
            candidate = source.with_name(filename.replace('-cp313-cp313-', '-cp314-cp314-'))
            with zipfile.ZipFile(source) as original, zipfile.ZipFile(candidate) as repacked:
                members = set(original.namelist())
                if members != set(repacked.namelist()):
                    raise RuntimeError('ANGLE archive members changed')
                changed = {name for name in members if original.read(name) != repacked.read(name)}
                wheel = next(name for name in members if name.endswith('.dist-info/WHEEL'))
                record = next(name for name in members if name.endswith('.dist-info/RECORD'))
                if changed != {wheel, record}:
                    raise RuntimeError('ANGLE payload changed during retagging')
                tags = Parser().parsestr(repacked.read(wheel).decode('utf8')).get_all('Tag')
                if tags != ['cp314-cp314-win_amd64']:
                    raise RuntimeError('Incorrect ANGLE wheel tags')
                for name in sorted(members):
                    if name.lower().endswith('.dll'):
                        print('ANGLE native payload: {} sha256={}'.format(
                            Path(name).name, hashlib.sha256(repacked.read(name)).hexdigest()), flush=True)
            target = (Path('dist') / candidate.name).resolve()
            target.write_bytes(candidate.read_bytes())
            reference = '{}#sha256={}'.format(target.as_uri(), hashlib.sha256(target.read_bytes()).hexdigest())
            constraint = '{} @ {}'.format(filename.split('-')[0], reference)
            constraints.append(constraint)
            print('ANGLE local wheel: ' + constraint, flush=True)
        Path('angle04-wheel-constraints.txt').write_text('\n'.join(constraints) + '\n', encoding='utf8')
        '@ | python -
        if ($LASTEXITCODE -ne 0) { throw 'Preparing verified ANGLE 0.4.0 cp314 wheels failed' }
        $angleWheels = @(Get-ChildItem -LiteralPath dist -Filter 'kivy_deps*angle*-cp314-cp314-win_amd64.whl' -File | ForEach-Object { $_.FullName })
        if ($angleWheels.Count -ne 2) { throw 'Expected the ANGLE 0.4.0 cp314 runtime/development pair' }
        python -m pip install --no-index --no-deps --force-reinstall @angleWheels
        if ($LASTEXITCODE -ne 0) { throw 'Installing the explicit ANGLE 0.4.0 trial wheels failed' }
        python ci/check_wheel_origins.py angle04-wheel-constraints.txt
        if ($LASTEXITCODE -ne 0) { throw 'ANGLE 0.4.0 pre-suite origin verification failed' }
        python -c "from kivy_deps import angle, angle_dev; print('ANGLE trial versions:', angle.__version__, angle_dev.__version__)"
        if ($LASTEXITCODE -ne 0) { throw 'Importing ANGLE 0.4.0 trial packages failed' }
    - name: Test package
      run: |
        . .\ci\windows_ci.ps1
        Test-kivy -KivyTestTarget stable
        python ci/check_wheel_origins.py angle04-wheel-constraints.txt
        if ($LASTEXITCODE -ne 0) { throw 'ANGLE 0.4.0 post-suite origin verification failed' }
